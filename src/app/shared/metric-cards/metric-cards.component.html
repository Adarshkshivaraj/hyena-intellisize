<div class="metrics-grid">
  <div class="metric-card">
    <h3 class="metric-title">CPU</h3>
    <div class="metric-value">{{ metrics.cpu }}</div>
  </div>

  <div class="metric-card">
    <h3 class="metric-title">GPU</h3>
    <div class="metric-value">{{ metrics.gpu }}</div>
  </div>

  <div class="metric-card">
    <h3 class="metric-title">Memory Consumption</h3>
    <div class="metric-value">{{ metrics.ram }}</div>
  </div>
</div>
